# Copy to secret.yaml (gitignored) and fill in real keys before applying.
# kubectl create secret generic llm-gateway-secrets -n llm-gateway \
#   --from-literal=LLM_GATEWAY_API_KEYS=<real-key-1>,<real-key-2>
apiVersion: v1
kind: Secret
metadata:
  name: llm-gateway-secrets
  namespace: llm-gateway
type: Opaque
stringData:
  LLM_GATEWAY_API_KEYS: "change-me-before-applying"
