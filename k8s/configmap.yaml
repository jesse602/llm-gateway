apiVersion: v1
kind: ConfigMap
metadata:
  name: llm-gateway-config
  namespace: llm-gateway
data:
  # host-gateway resolves to the bare-metal macOS host from inside the k3s VM,
  # where Ollama runs natively for GPU access.
  OLLAMA_BASE_URL: "http://host.lima.internal:11434"
  RATE_LIMIT_REQUESTS: "20"
  RATE_LIMIT_WINDOW_SECONDS: "60"
  MAX_CONCURRENCY: "2"
  QUEUE_TIMEOUT_SECONDS: "60"
